# HomeBase on the Linux PC: hub + HTTPS front door + plane tracker + MagicMirror².
#
#   cd deploy
#   ./pin-images.sh                                     # base images by digest → .env
#   cp hub.env.example hub.env && chmod 600 hub.env     # then fill it in
#   cp mirror.env.example mirror.env && chmod 600 mirror.env
#   mkdir -p data backups caddy-data tracker-data \
#     && sudo chown -R 10001:10001 data backups caddy-data tracker-data \
#     && sudo chmod 700 data backups caddy-data tracker-data
#   docker compose build && docker compose up -d
#
# Ports (bind them to the PC's LAN address if it has more than one network):
#   8443  https://<pc>:8443 every browser, the Pi screen included (Caddy)
#   8080  http://<pc>:8080  redirects to https (old bookmarks and screen links)
#   3000  http://<pc>:3000  the hub directly, for the HomeBase iPhone app
#   8081  http://<pc>:8081  read-only flight/weather feed for the LED board
#                           (the board runs the tracker as a slave of this PC)
#
# Security posture (README §7.5): non-root, read-only root filesystem, all
# capabilities dropped, no privilege escalation, resource limits. MagicMirror
# has no published port: the hub's /mirror/ proxy is its only way in.

x-hardening: &hardening
  read_only: true
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  user: "10001:10001"
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

networks:
  # Caddy ↔ hub. Fixed addresses so the hub can trust exactly one proxy.
  edge:
    ipam:
      config:
        - subnet: 172.30.87.0/24
  # hub ↔ MagicMirror. MagicMirror only accepts connections from this subnet.
  mirror:
    ipam:
      config:
        - subnet: 172.30.88.0/24
  # hub/Caddy ↔ the plane tracker. Its own web app (settings, Wi-Fi, restart)
  # is reachable only here; the LED board gets read-only paths via Caddy :8081.
  tracker:
    ipam:
      config:
        - subnet: 172.30.89.0/24

services:
  hub:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/hub.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:26-bookworm-slim}
    image: homebase-hub:local
    env_file: ./hub.env
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      NODE_ENV: production
      TZ: ${TZ:-America/Chicago}
      # Only Caddy (below) may set X-Forwarded-* headers.
      TRUST_PROXY: 172.30.87.10
      MIRROR_URL: http://magicmirror:8080
      # The bundled plane tracker (below). Overrides TRACKER_URL in hub.env.
      TRACKER_URL: http://tracker:8080
      TRACKER_BUNDLED: "true"
      # So Settings can point the LED board at this server's feed (caddy :8081).
      TRACKER_FEED_PORT: ${TRACKER_FEED_PORT:-8081}
    volumes:
      - ./data:/data
      - ./backups:/backups
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      edge:
        ipv4_address: 172.30.87.20
      mirror:
        ipv4_address: 172.30.88.20
      tracker:
        ipv4_address: 172.30.89.20
    ports:
      # The iPhones' saved address. Browsers should use https:// (Caddy).
      - "3000:3000"
    mem_limit: 512m
    cpus: 1.5
    pids_limit: 256

  caddy:
    <<: *hardening
    build:
      context: .
      dockerfile: caddy.Dockerfile
      args:
        CADDY_IMAGE: ${CADDY_IMAGE:-caddy:2-alpine}
    image: homebase-caddy:local
    depends_on: [hub]
    environment:
      # Every name/address you'll type in a browser, space separated, e.g.
      # "192.168.1.20 homebase.lan". Set HUB_HOSTS in deploy/.env.
      HUB_HOSTS: ${HUB_HOSTS:?set HUB_HOSTS in deploy/.env (the PC's LAN IP and/or name)}
      # So http → https redirects point at the right port.
      HTTPS_PORT: ${HTTPS_PORT:-8443}
      XDG_DATA_HOME: /data
      XDG_CONFIG_HOME: /config
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Holds the local CA's private key: owner-only, never commit or share.
      - ./caddy-data:/data
    tmpfs:
      - /config:size=8m,mode=0700,uid=10001,gid=10001
      - /tmp:size=16m,mode=1777
    networks:
      edge:
        ipv4_address: 172.30.87.10
      tracker:
        ipv4_address: 172.30.89.10
    ports:
      # 8443 by default so HomeBase never fights another web server for 443.
      # Change HTTPS_PORT / HTTP_PORT in deploy/.env if they're taken too.
      - "${HTTPS_PORT:-8443}:8443"
      - "${HTTP_PORT:-8080}:8080"
      # Read-only feed for the LED board (see the tracker service).
      - "${TRACKER_FEED_PORT:-8081}:8081"
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  # The plane tracker (its-a-plane-python, bundled in ../tracker), headless, as
  # the house's master tracker: flights, routes (your API keys), weather,
  # alerts, ISS, tracked flight and stats. HomeBase is its UI; its state is
  # in ./tracker-data. See tracker/UPSTREAM.md.
  tracker:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/tracker.Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.14-slim}
    image: homebase-tracker:local
    environment:
      TZ: ${TZ:-America/Chicago}
    volumes:
      - ./tracker-data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    # Outbound internet for adsb.lol/OpenSky, AirLabs/FlightAware/FR24,
    # Tomorrow.io, NWS, FAA and CelesTrak. No published port.
    networks:
      tracker:
        ipv4_address: 172.30.89.40
    mem_limit: 384m
    cpus: 0.75
    pids_limit: 128

  magicmirror:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/mirror.Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:26-bookworm-slim}
    image: homebase-magicmirror:local
    depends_on: [hub]
    # HOMEBASE_DEVICE_TOKEN, HOME_LAT/LON, UNITS (see mirror.env.example).
    env_file: ./mirror.env
    environment:
      TZ: ${TZ:-America/Chicago}
      NODE_ENV: production
      HOMEBASE_HUB_URL: http://hub:3000
      MM_ALLOWED_CIDRS: 172.30.88.0/24,127.0.0.1/32
    volumes:
      - ../mirror/config/config.js:/opt/magic_mirror/config/config.js:ro
      - ../mirror/config/basepath.js:/opt/magic_mirror/config/basepath.js:ro
      - ../mirror/config/custom.css:/opt/magic_mirror/config/custom.css:ro
    tmpfs:
      - /tmp:size=32m,mode=1777
    # Outbound internet only for the weather module (api.open-meteo.com).
    networks:
      mirror:
        ipv4_address: 172.30.88.30
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128

  # One-off helper: clones/updates the airline logo set into ./data/logo-src.
  #   docker compose run --rm logos
  logos:
    <<: *hardening
    restart: "no"
    image: ${GIT_IMAGE:-alpine/git:latest}
    profiles: ["tools"]
    volumes:
      - ./data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    environment:
      HOME: /tmp
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        if [ -d /data/logo-src/.git ]; then git -C /data/logo-src pull --ff-only;
        else git clone --depth 1 https://github.com/Jxck-S/airline-logos /data/logo-src; fi
